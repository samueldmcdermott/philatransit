[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "static", "public", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "C4", "RET", "ARG"]
# Line length is advisory here: several modules use aligned constant tables
# and long explanatory comments that read better than a hard wrap.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals (_entry_minute, _is_ghost, _insort_entry)
# deliberately — that private logic is what needs pinning down.
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
